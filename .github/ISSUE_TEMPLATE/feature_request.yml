name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Existing issues
      options:
        - label: I have searched the existing issues and this feature is not requested yet.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to be able to do, and why?
    validations:
      required: true
