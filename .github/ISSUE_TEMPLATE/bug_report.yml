name: Bug report
description: Report something that does not work as expected
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Existing issues
      options:
        - label: I have searched the existing issues and this bug is not reported yet.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Quick Settings
        2. ...
    validations:
      required: true
  - type: input
    id: shell-version
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`
    validations:
      required: true
  - type: input
    id: asusd-version
    attributes:
      label: asusd version
      description: Output of `asusctl --version`
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution
      placeholder: Ubuntu 26.04, Fedora 44, ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl -b -o cat /usr/bin/gnome-shell | grep -i asusd`
      render: shell
